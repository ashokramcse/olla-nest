# Whisper voice transcription sidecar
#
# Adds a local Whisper ASR service so voice input works in Firefox
# and all other browsers that don't support the Web Speech API.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.whisper.yml up --build
#
# The whisper image (~1.5GB) downloads the 'tiny' model on first start.
# Swap WHISPER_MODEL to 'base', 'small', or 'medium' for better accuracy.
#
# CPU-only by default. For GPU support uncomment the deploy section below.

services:
  app:
    environment:
      WHISPER_URL: "http://whisper:9000"

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: olla-nest-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: tiny
      ASR_ENGINE: openai_whisper
    ports:
      - "9000:9000"
    # GPU support (uncomment if you have NVIDIA GPU + nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
