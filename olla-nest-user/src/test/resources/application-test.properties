# ── Test profile: in-memory SQLite, Flyway enabled for schema creation ────────
# Shared in-process in-memory SQLite kept alive by the single Hikari connection.
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared&foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=MEMORY; PRAGMA foreign_keys=ON;
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# Flyway enabled to build the schema; DatabaseService is mocked so no seeding
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Mirror the production autoconfigure.exclude so this context-load test exercises
# the same excluded class as the running app — guards against framework upgrades
# relocating the class (Spring Boot 4 moved it to a new package).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# No real Ollama / Whisper
app.ollama-base-url=http://localhost:11440
app.whisper-enabled=false

# Use insecure cookies in test
app.cookie-secure=false

# Random port to avoid conflicts
server.port=0

# Suppress DB seeding logs
logging.level.com.ollanest.service.DatabaseService=WARN
logging.level.com.ollanest=INFO
