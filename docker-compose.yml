services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: olla-nest-postgres
    environment:
      POSTGRES_DB: olla_nest
      POSTGRES_USER: olla_nest
      POSTGRES_PASSWORD: CHANGE_ME_ON_FIRST_BOOT
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mongo:
    image: mongo:7
    container_name: olla-nest-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: olla-nest-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  mongo-data:
  redis-data:
