# =============================================================================
# Olla Nest — Test Profile Configuration
# =============================================================================
# Activated by @ActiveProfiles("test") in all test classes.
# Overrides only what must differ in the test environment.
# =============================================================================

# ── In-memory SQLite — isolated per test run ──────────────────────────────────
spring.datasource.url=jdbc:sqlite:file::memory:?cache=shared
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON;

# ── Flyway — seed test DB ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ── Disable Loki log shipping in tests ───────────────────────────────────────
loki.enabled=false
loki.url=http://localhost:9999/loki/api/v1/push

# ── Disable Whisper server auto-start in tests ────────────────────────────────
whisper.server.auto-start=false

# ── Known admin credentials (seeded by Flyway) ───────────────────────────────
app.default-admin-email=admin@ollanest.local
app.default-admin-password=CHANGE_ME_ON_FIRST_BOOT

# ── Disable cookie secure flag so tests run without HTTPS ────────────────────
app.cookie-secure=false

# ── Quiet logging in test output ─────────────────────────────────────────────
logging.level.com.ollanest=WARN
logging.level.org.flywaydb=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN
