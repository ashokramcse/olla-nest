# =============================================================================
# Olla Nest — Application Configuration
# Version  : v2026.1.4
# Runtime  : Oracle Java 26 JVM  |  Spring Boot 3.5.3
# Database : SQLite 3.49.x (WAL mode, Flyway managed)
# Build    : Maven 3.9+  →  java -jar target/olla-nest-*.jar
# =============================================================================

# ── Application name (used as Loki label: app=olla-nest) ─────────────────────
spring.application.name=olla-nest

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── SQLite datasource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./data}/olla-nest.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-timeout=30000
# Pool-size MUST stay 1 — SQLite supports only one concurrent writer
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
# SQLite pragmas applied to every new connection
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON; PRAGMA synchronous=NORMAL; PRAGMA busy_timeout=5000;

# ── Flyway schema migrations ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ── Spring Security — disable default auto-config (we use custom cookie auth) ─
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── Olla Nest app settings ───────────────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
encryption.key=${ENCRYPTION_KEY:change-me-in-production}
app.data-dir=${DATA_DIR:./data}
app.static-dir=${STATIC_DIR:./public}
app.version=v2026.1.4
app.cookie-secure=${COOKIE_SECURE:false}
app.trusted-proxy=${TRUSTED_PROXY:}
app.default-admin-email=${DEFAULT_ADMIN_EMAIL:admin@ollanest.local}
app.default-admin-password=${DEFAULT_ADMIN_PASSWORD:CHANGE_ME_ON_FIRST_BOOT}
app.default-user-password=${DEFAULT_USER_PASSWORD:CHANGE_ME_ON_FIRST_BOOT}

# ── RAG (Retrieval-Augmented Generation) ─────────────────────────────────────
rag.enabled=true
rag.top-k=5
rag.similarity-threshold=0.30

# ── Function calling ─────────────────────────────────────────────────────────
functions.enabled=true

# ── Spring AI — core only; auto-config disabled (no API keys required here) ──
spring.ai.enabled=false

# ── File upload (RAG document ingestion) ─────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ollanest=INFO
logging.level.org.flywaydb=WARN
logging.level.org.springframework.security=WARN

# ── Grafana Loki log shipping (via loki4j Logback appender) ──────────────────
# Set loki.enabled=false to disable shipping (console-only mode)
loki.enabled=true
loki.url=http://localhost:3100/loki/api/v1/push

# ── Spring Security filter order (our filters take precedence) ───────────────
spring.security.filter.order=10

# ── SSE / streaming — disable timeout so long AI responses are not cut off ───
spring.mvc.async.request-timeout=-1

# ── Session — disabled at servlet level (we manage sessions in SQLite) ───────
server.servlet.session.timeout=0
