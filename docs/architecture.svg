  <!-- Step pills -->
  <rect x="70"  y="200" width="108" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="124" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">① Classify</text>

  <rect x="190" y="200" width="108" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="244" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">② Authorise</text>

  <rect x="310" y="200" width="108" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="364" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">③ Score</text>

  <rect x="430" y="200" width="108" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="484" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">④ Select</text>

  <rect x="550" y="200" width="148" height="26" rx="7" fill="#1a1400" stroke="#F5C800" stroke-width="1" opacity="0.8"/>
  <text x="624" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#F5C800">⑤ Privacy Gate</text>

  <!-- Fork arrows down -->
  <line x1="390" y1="250" x2="390" y2="272" stroke="#F5C800" stroke-width="2" opacity="0.9"/>
  <line x1="170" y1="272" x2="610" y2="272" stroke="#F5C800" stroke-width="1.5" opacity="0.5"/>
  <line x1="170" y1="272" x2="170" y2="294" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)" opacity="0.8"/>
  <line x1="390" y1="272" x2="390" y2="294" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)" opacity="0.8"/>
  <line x1="610" y1="272" x2="610" y2="294" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah-muted)"/>

  <!-- ── LOCAL MODELS ───────────────────────────────────────────────── -->
  <rect x="50" y="298" width="238" height="126" rx="10"
