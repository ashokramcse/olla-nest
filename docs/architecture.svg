  <text x="169" y="336" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#71717a">Ollama on host machine</text>

  <rect x="66"  y="346" width="96" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="114" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">gemma3:4b</text>
  <rect x="172" y="346" width="100" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="222" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">qwen2.5:7b</text>
  <rect x="66"  y="372" width="96" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="114" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">llama3.1:8b</text>
  <rect x="172" y="372" width="100" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="222" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">any pulled model</text>

  <rect x="72"  y="398" width="180" height="14" rx="4" fill="#052a14" stroke="#4ade80" stroke-width="1"/>
  <circle cx="82" cy="405" r="3" fill="#4ade80"/>
  <text x="162" y="409" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#4ade80">100% LOCAL · NO DATA LEAVES NETWORK</text>

  <!-- ── CLOUD PROVIDERS ───────────────────────────────────────────── -->
  <rect x="271" y="298" width="238" height="126" rx="10"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="271" y="298" width="238" height="3" rx="2" fill="#60a5fa"/>
  <text x="390" y="321" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="900" fill="#60a5fa" letter-spacing="0.04em">CLOUD PROVIDERS</text>
  <text x="390" y="336" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#71717a">API keys encrypted at rest</text>

  <rect x="285" y="346" width="80" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="325" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Anthropic</text>
  <rect x="375" y="346" width="64" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="407" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">OpenAI</text>
  <rect x="285" y="372" width="56" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="313" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Groq</text>
  <rect x="351" y="372" width="88" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="395" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">OpenAI-compat</text>

  <rect x="290" y="398" width="200" height="14" rx="4" fill="#0a1628" stroke="#60a5fa" stroke-width="1"/>
  <circle cx="300" cy="405" r="3" fill="#60a5fa"/>
  <text x="390" y="409" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#60a5fa">REAL /v1/models API · NO HARDCODED LISTS</text>

  <!-- ── ADMIN CONTROL ─────────────────────────────────────────────── -->
  <rect x="492" y="298" width="218" height="126" rx="10"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="492" y="298" width="218" height="3" rx="2" fill="#a1a1aa"/>
  <text x="601" y="321" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="900" fill="#a1a1aa" letter-spacing="0.04em">ADMIN CONTROL</text>
  <text x="601" y="336" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#71717a">RBAC · Audit · Governance</text>

  <rect x="506" y="346" width="86" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="549" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Users/Groups</text>
  <rect x="602" y="346" width="92" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="648" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Access Control</text>
  <rect x="506" y="372" width="86" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="549" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Audit Trail</text>
  <rect x="602" y="372" width="92" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="648" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Reports</text>

  <rect x="510" y="398" width="182" height="14" rx="4" fill="#111115" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="520" cy="405" r="3" fill="#a1a1aa"/>
  <text x="601" y="409" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#71717a">BCRYPT · AES-256-GCM · CSRF · HSTS</text>

  <!-- ── RESPONSE PATH ─────────────────────────────────────────────── -->
  <line x1="169" y1="424" x2="169" y2="450" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
  <line x1="169" y1="450" x2="390" y2="450" stroke="#F5C800" stroke-width="1.5" opacity="0.5"/>
  <line x1="390" y1="424" x2="390" y2="450" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <line x1="390" y1="450" x2="390" y2="468" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Response node -->
  <rect x="210" y="472" width="360" height="36" rx="18"
        fill="#1c1c22" stroke="#F5C800" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="234" cy="490" r="5" fill="#F5C800"/>
  <text x="390" y="494" text-anchor="middle"
        font-family="'Arial','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" fill="#f4f4f5">Streamed response → Employee</text>

  <!-- SQLite node -->
  <rect x="600" y="444" width="136" height="48" rx="8"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="600" y="444" width="136" height="3" rx="2" fill="#fb923c"/>
  <text x="668" y="463" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="10" font-weight="900" fill="#fb923c">SQLite WAL</text>
  <text x="668" y="477" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#71717a">sessions · audit · models · users</text>
  <!-- Dashed connector to admin -->
  <line x1="601" y1="390" x2="601" y2="444" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Footer -->
  <line x1="24" y1="510" x2="736" y2="510" stroke="#2a2a30" stroke-width="1"/>
  <text x="390" y="519" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#3f3f46" letter-spacing="0.06em">OLLA NEST · Self-hosted Company AI Workspace · github.com/ashokramcse/olla-nest</text>

</svg>
