<svg width="820" height="520" viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Olla Nest Auto Router Architecture Diagram">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#F5C800"/>
    </marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#3f3f46"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="router-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1400;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a0c;stop-opacity:1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="820" height="520" rx="16" fill="#0a0a0c"/>
  <rect width="820" height="520" rx="16" fill="url(#grid)"/>

  <!-- Logo mark (top-left) -->
  <rect x="24" y="18" width="28" height="28" rx="7" fill="#F5C800"/>
  <path d="M38 23 A11 11 0 1 1 27 34" stroke="#1a1600" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M38 27.5 A6.5 6.5 0 1 1 31.5 34" stroke="#1a1600" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="34" r="1.8" fill="#1a1600"/>
  <!-- Wordmark -->
  <text x="60" y="31" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="900" fill="#f4f4f5" letter-spacing="0.05em">OLLA·NEST</text>
  <text x="60" y="42" font-family="'Courier New',Courier,monospace" font-size="8" fill="#71717a" letter-spacing="0.12em">// AUTO ROUTER ARCHITECTURE</text>
  <!-- Version tag (right-aligned for 820px wide) -->
  <rect x="750" y="18" width="44" height="18" rx="5" fill="#1a1400" stroke="#F5C800" stroke-width="1"/>
  <text x="772" y="31" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="700" fill="#F5C800">v2026</text>

  <!-- Divider -->
  <line x1="24" y1="56" x2="796" y2="56" stroke="#2a2a30" stroke-width="1"/>

  <!-- ── ENTRY NODE ─────────────────────────────────────────────────── -->
  <!-- Center: 410. Rect: x=255, w=310 → 255-565 -->
  <rect x="255" y="70" width="310" height="44" rx="22"
        fill="#1c1c22" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="280" cy="92" r="5" fill="#F5C800"/>
  <text x="410" y="96" text-anchor="middle"
        font-family="'Arial','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" fill="#f4f4f5">Employee types anything</text>
  <!-- Right tag: starts at 582, well clear of entry node (ends 565) -->
  <rect x="582" y="75" width="96" height="18" rx="5" fill="#1a1400" stroke="#F5C800" stroke-width="1"/>
  <text x="630" y="88" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#F5C800" letter-spacing="0.08em">ENTRY POINT</text>

  <!-- Arrow down -->
  <line x1="410" y1="114" x2="410" y2="138" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)" opacity="0.9"/>

  <!-- ── AUTO ROUTER ─────────────────────────────────────────────────── -->
  <!-- Rect: x=28, w=764 → 28-792 -->
  <rect x="28" y="142" width="764" height="108" rx="12"
        fill="url(#router-grad)" stroke="#F5C800" stroke-width="2" filter="url(#shadow)"/>
  <!-- Accent top stripe -->
  <rect x="28" y="142" width="764" height="4" rx="2" fill="#F5C800"/>
  <!-- Corner badge -->
  <rect x="34" y="151" width="110" height="20" rx="5" fill="#F5C800"/>
  <text x="89" y="165" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="700" fill="#1a1600" letter-spacing="0.1em">AUTO ROUTER</text>

  <text x="410" y="186" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="15" font-weight="900" fill="#F5C800" letter-spacing="0.04em">Classify  ·  Authorise  ·  Score  ·  Select</text>

  <!-- Step pills: 5 pills in 764px inner (x=44 to x=776 = 732px), each 134px, gaps 12px -->
  <!-- Pill 1: x=44-178 -->
  <rect x="44"  y="200" width="134" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="111" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">① Classify</text>

  <!-- Pill 2: x=190-324 -->
  <rect x="190" y="200" width="134" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="257" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">② Authorise</text>

  <!-- Pill 3: x=336-470 -->
  <rect x="336" y="200" width="134" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="403" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">③ Score</text>

  <!-- Pill 4: x=482-616 -->
  <rect x="482" y="200" width="134" height="26" rx="7" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="549" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#a1a1aa">④ Select</text>

  <!-- Pill 5: x=628-776 (Privacy Gate, accent) -->
  <rect x="628" y="200" width="148" height="26" rx="7" fill="#1a1400" stroke="#F5C800" stroke-width="1" opacity="0.85"/>
  <text x="702" y="218" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="10" fill="#F5C800">⑤ Privacy Gate</text>

  <!-- Fork arrows down from router (y=250) -->
  <!-- Stem -->
  <line x1="410" y1="250" x2="410" y2="272" stroke="#F5C800" stroke-width="2" opacity="0.9"/>
  <!-- Horizontal spanning all three box centers: LOCAL=151, CLOUD=410, ADMIN=670 -->
  <line x1="151" y1="272" x2="670" y2="272" stroke="#F5C800" stroke-width="1.5" opacity="0.5"/>
  <!-- Down to LOCAL (yellow) -->
  <line x1="151" y1="272" x2="151" y2="294" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)" opacity="0.8"/>
  <!-- Down to CLOUD (yellow) -->
  <line x1="410" y1="272" x2="410" y2="294" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)" opacity="0.8"/>
  <!-- Down to ADMIN (muted — admin is control plane, not output) -->
  <line x1="670" y1="272" x2="670" y2="294" stroke="#3f3f46" stroke-width="1.5" marker-end="url(#ah-muted)"/>

  <!-- ── LOCAL MODELS: x=28, w=246 → 28-274, center=151 ───────────────── -->
  <rect x="28" y="298" width="246" height="126" rx="10"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="28" y="298" width="246" height="3" rx="2" fill="#4ade80"/>
  <text x="151" y="321" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="900" fill="#4ade80" letter-spacing="0.04em">LOCAL MODELS</text>
  <text x="151" y="336" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#71717a">Ollama on host machine</text>

  <rect x="44"  y="346" width="96" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="92"  y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">gemma3:4b</text>
  <rect x="150" y="346" width="108" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="204" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">qwen2.5:7b</text>
  <rect x="44"  y="372" width="96" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="92"  y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">llama3.1:8b</text>
  <rect x="150" y="372" width="108" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="204" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">any pulled model</text>

  <rect x="44"  y="398" width="184" height="14" rx="4" fill="#052a14" stroke="#4ade80" stroke-width="1"/>
  <circle cx="56" cy="405" r="3" fill="#4ade80"/>
  <text x="151" y="409" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#4ade80">100% LOCAL · NO DATA LEAVES</text>

  <!-- ── CLOUD PROVIDERS: x=288, w=246 → 288-534, center=411 ─────────── -->
  <rect x="288" y="298" width="246" height="126" rx="10"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="288" y="298" width="246" height="3" rx="2" fill="#60a5fa"/>
  <text x="411" y="321" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="900" fill="#60a5fa" letter-spacing="0.04em">CLOUD PROVIDERS</text>
  <text x="411" y="336" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#71717a">API keys encrypted at rest</text>

  <rect x="302" y="346" width="80" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="342" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Anthropic</text>
  <rect x="392" y="346" width="64" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="424" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">OpenAI</text>
  <rect x="302" y="372" width="56" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="330" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Groq</text>
  <rect x="368" y="372" width="100" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="418" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">OpenAI-compat</text>

  <rect x="304" y="398" width="214" height="14" rx="4" fill="#0a1628" stroke="#60a5fa" stroke-width="1"/>
  <circle cx="316" cy="405" r="3" fill="#60a5fa"/>
  <text x="411" y="409" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#60a5fa">REAL /v1/models API · NO HARDCODED LISTS</text>

  <!-- ── ADMIN CONTROL: x=548, w=244 → 548-792, center=670 ────────────── -->
  <rect x="548" y="298" width="244" height="126" rx="10"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="548" y="298" width="244" height="3" rx="2" fill="#a1a1aa"/>
  <text x="670" y="321" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="12" font-weight="900" fill="#a1a1aa" letter-spacing="0.04em">ADMIN CONTROL</text>
  <text x="670" y="336" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="9" fill="#71717a">RBAC · Audit · Governance</text>

  <rect x="562" y="346" width="90" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="607" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Users/Groups</text>
  <rect x="662" y="346" width="96" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="710" y="359" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Access Control</text>
  <rect x="562" y="372" width="90" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="607" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Audit Trail</text>
  <rect x="662" y="372" width="96" height="18" rx="5" fill="#1c1c22" stroke="#3f3f46" stroke-width="1"/>
  <text x="710" y="385" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" fill="#a1a1aa">Reports</text>

  <rect x="566" y="398" width="188" height="14" rx="4" fill="#111115" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="578" cy="405" r="3" fill="#a1a1aa"/>
  <text x="670" y="409" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#71717a">BCRYPT · AES-256-GCM · CSRF · HSTS</text>

  <!-- ── RESPONSE PATH ──────────────────────────────────────────────────── -->
  <!-- LOCAL (151) → down to y=450, right to CLOUD center (411) -->
  <line x1="151" y1="424" x2="151" y2="450" stroke="#4ade80" stroke-width="1.5" opacity="0.5"/>
  <line x1="151" y1="450" x2="411" y2="450" stroke="#F5C800" stroke-width="1.5" opacity="0.5"/>
  <!-- CLOUD (411) → down to y=450, join -->
  <line x1="411" y1="424" x2="411" y2="450" stroke="#60a5fa" stroke-width="1.5" opacity="0.5"/>
  <!-- Arrow down to response node -->
  <line x1="411" y1="450" x2="411" y2="468" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Response node: center=411, x=221, w=380 → 221-601 -->
  <rect x="221" y="472" width="380" height="36" rx="18"
        fill="#1c1c22" stroke="#F5C800" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="246" cy="490" r="5" fill="#F5C800"/>
  <text x="411" y="494" text-anchor="middle"
        font-family="'Arial','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" fill="#f4f4f5">Streamed response → Employee</text>

  <!-- SQLite node: x=622, w=150 → 622-772, center=697 (clear of response node which ends at 601) -->
  <rect x="622" y="444" width="150" height="48" rx="8"
        fill="#111115" stroke="#3f3f46" stroke-width="1.5"/>
  <rect x="622" y="444" width="150" height="3" rx="2" fill="#fb923c"/>
  <text x="697" y="463" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="10" font-weight="900" fill="#fb923c">SQLite WAL</text>
  <text x="697" y="477" text-anchor="middle"
        font-family="'Courier New',Courier,monospace" font-size="8" fill="#71717a">sessions · audit · models · users</text>
  <!-- Dashed connector: from inside admin box down to SQLite -->
  <line x1="670" y1="424" x2="670" y2="444" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>

  <!-- Footer -->
  <line x1="24" y1="510" x2="796" y2="510" stroke="#2a2a30" stroke-width="1"/>
  <text x="410" y="519" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#3f3f46" letter-spacing="0.06em">OLLA NEST · Self-hosted Company AI Workspace · Spring Boot 4.1 · Spring AI 2.0 · github.com/ashokramcse/olla-nest</text>

</svg>
