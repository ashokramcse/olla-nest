<svg width="640" height="440" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Olla Nest Auto Router Architecture Diagram">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#4b5563"/>
    </marker>
    <filter id="glow-blue" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="router-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f2040;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="ollama-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2d18;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#071a0e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1505;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#180c02;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="440" rx="14" fill="#0d1117"/>

  <!-- ── TOP: Entry node ─────────────────────────────────────── -->
  <rect x="195" y="22" width="250" height="40" rx="20"
        fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="47" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14" font-weight="600" fill="#e6edf3">Employee types anything</text>

  <!-- Arrow: entry → router -->
  <line x1="320" y1="62" x2="320" y2="87"
        stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ── AUTO ROUTER box ────────────────────────────────────── -->
  <rect x="80" y="91" width="480" height="98" rx="10"
        fill="url(#router-grad)" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>

  <!-- Blue glow bar at top of router -->
  <rect x="80" y="91" width="480" height="4" rx="2" fill="#3b82f6" opacity="0.7"/>

  <text x="320" y="121" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="15" font-weight="700" fill="#60a5fa" letter-spacing="1">AUTO ROUTER</text>
  <text x="320" y="145" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12" fill="#93c5fd">Classify request  →  Score models  →  Pick best one</text>
  <text x="320" y="167" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#6b7280">capability  ×  speed  ×  quality  ×  privacy weight</text>

  <!-- ── Fork connector ────────────────────────────────────── -->
  <!-- Stem down from router -->
  <line x1="320" y1="189" x2="320" y2="208"
        stroke="#374151" stroke-width="2"/>
  <!-- Horizontal bar -->
  <line x1="200" y1="208" x2="440" y2="208"
        stroke="#374151" stroke-width="2"/>
  <!-- Left arrow down -->
  <line x1="200" y1="208" x2="200" y2="238"
        stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>
  <!-- Right arrow down -->
  <line x1="440" y1="208" x2="440" y2="238"
        stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ── OLLAMA box ──────────────────────────────────────────── -->
  <rect x="80" y="242" width="240" height="100" rx="10"
        fill="url(#ollama-grad)" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <rect x="80" y="242" width="240" height="4" rx="2" fill="#22c55e" opacity="0.7"/>

  <text x="200" y="274" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14" font-weight="700" fill="#4ade80">Ollama  (local)</text>
  <text x="200" y="297" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12" fill="#86efac">Runs on your GPU</text>
  <text x="200" y="318" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12" fill="#86efac">any model you pull</text>

  <!-- ── CLOUD PROVIDERS box ───────────────────────────────── -->
  <rect x="320" y="242" width="240" height="100" rx="10"
        fill="url(#cloud-grad)" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <rect x="320" y="242" width="240" height="4" rx="2" fill="#f97316" opacity="0.7"/>

  <text x="440" y="274" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14" font-weight="700" fill="#fb923c">Cloud Providers</text>
  <text x="440" y="297" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12" fill="#fdba74">Anthropic  ·  OpenAI</text>
  <text x="440" y="318" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12" fill="#fdba74">Groq  ·  custom</text>

  <!-- ── Merge connector ───────────────────────────────────── -->
  <!-- Left up from Ollama -->
  <line x1="200" y1="342" x2="200" y2="370"
        stroke="#374151" stroke-width="2"/>
  <!-- Right up from Cloud -->
  <line x1="440" y1="342" x2="440" y2="370"
        stroke="#374151" stroke-width="2"/>
  <!-- Horizontal merge bar -->
  <line x1="200" y1="370" x2="440" y2="370"
        stroke="#374151" stroke-width="2"/>
  <!-- Arrow down to response -->
  <line x1="320" y1="370" x2="320" y2="394"
        stroke="#4b5563" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ── Response node ─────────────────────────────────────── -->
  <rect x="160" y="398" width="320" height="24" rx="12"
        fill="#161b22" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="320" y="415" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="12.5" fill="#c9d1d9">Response streamed back  ·  full session memory</text>
</svg>
