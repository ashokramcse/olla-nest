<svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Olla Nest Auto Router Architecture Diagram">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#F5C800"/>
    </marker>
    <marker id="ah-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#3f3f46"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="router-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1400;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a0c;stop-opacity:1"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="760" height="520" rx="16" fill="#0a0a0c"/>
  <rect width="760" height="520" rx="16" fill="url(#grid)"/>

  <!-- Logo mark (top-left) -->
  <rect x="24" y="18" width="28" height="28" rx="7" fill="#F5C800"/>
  <path d="M38 23 A11 11 0 1 1 27 34" stroke="#1a1600" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M38 27.5 A6.5 6.5 0 1 1 31.5 34" stroke="#1a1600" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="38" cy="34" r="1.8" fill="#1a1600"/>
  <!-- Wordmark -->
  <text x="60" y="31" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="900" fill="#f4f4f5" letter-spacing="0.05em">OLLA·NEST</text>
  <text x="60" y="42" font-family="'Courier New',Courier,monospace" font-size="8" fill="#71717a" letter-spacing="0.12em">// AUTO ROUTER ARCHITECTURE</text>
  <!-- Version tag -->
  <rect x="696" y="18" width="44" height="18" rx="5" fill="#1a1400" stroke="#F5C800" stroke-width="1"/>
  <text x="718" y="31" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="700" fill="#F5C800">v2026</text>

  <!-- Divider -->
  <line x1="24" y1="56" x2="736" y2="56" stroke="#2a2a30" stroke-width="1"/>

  <!-- ── ENTRY NODE ────────────────────────────────────────────────── -->
  <rect x="230" y="70" width="300" height="44" rx="22"
        fill="#1c1c22" stroke="#3f3f46" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="255" cy="92" r="5" fill="#F5C800"/>
  <text x="390" y="96" text-anchor="middle"
        font-family="'Arial','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" fill="#f4f4f5">Employee types anything</text>
  <!-- Right tag -->
  <rect x="556" y="75" width="90" height="18" rx="5" fill="#1a1400" stroke="#F5C800" stroke-width="1"/>
  <text x="601" y="88" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="8" fill="#F5C800" letter-spacing="0.08em">ENTRY POINT</text>

  <!-- Arrow down -->
  <line x1="390" y1="114" x2="390" y2="138" stroke="#F5C800" stroke-width="2" marker-end="url(#ah)" opacity="0.9"/>

  <!-- ── AUTO ROUTER ────────────────────────────────────────────────── -->
  <rect x="50" y="142" width="660" height="108" rx="12"
        fill="url(#router-grad)" stroke="#F5C800" stroke-width="2" filter="url(#shadow)"/>
  <!-- Accent top stripe -->
  <rect x="50" y="142" width="660" height="4" rx="2" fill="#F5C800"/>
  <!-- Corner badge -->
  <rect x="56" y="151" width="106" height="20" rx="5" fill="#F5C800"/>
  <text x="109" y="165" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="9" font-weight="700" fill="#1a1600" letter-spacing="0.1em">AUTO ROUTER</text>

  <text x="390" y="188" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
