<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Squircle background -->
  <rect width="40" height="40" rx="11" fill="var(--ac, #F5C800)"/>
  <!-- Outer nest ring: 270° arc, clockwise from top (12 o'clock) to left (9 o'clock) -->
  <path d="M20 8 A12 12 0 1 1 8 20" stroke="var(--ac-text,#1a1600)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Inner nest ring: 270° arc, same orientation -->
  <path d="M20 13 A7 7 0 1 1 13 20" stroke="var(--ac-text,#1a1600)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Centre dot -->
  <circle cx="20" cy="20" r="2.2" fill="var(--ac-text,#1a1600)"/>
</svg>
