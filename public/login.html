<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Olla Nest — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-grad-1: #e9e7e2;
      --bg-grad-2: #f6e9a8;
      --cream:      #fdf6d8;
      --cream-soft: #fbf3c8;
      --paper:      #f5f3ed;
      --ink:        #15140f;
      --ink-2:      #1d1c17;
      --line:       #0000001a;
      --line-soft:  #00000010;
      --mute:       #7a7a72;
      --mute-2:     #a3a39a;
      --yellow:     #f4d33a;
      --yellow-deep:#e8c624;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(120% 80% at 90% 30%, #f7e58a 0%, transparent 55%),
        radial-gradient(120% 80% at 10% 80%, #f2efe5 0%, transparent 50%),
        linear-gradient(180deg, #e8e6e0 0%, #efeadf 40%, #f7eea8 100%);
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      padding: 32px 20px;
    }

    /* ── Page wrapper ── */
    .page {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: center;
    }

    /* ── Left: brand card ── */
    .brand-card {
      background:
        radial-gradient(140% 90% at 100% 100%, #f7e58a 0%, transparent 55%),
        radial-gradient(140% 90% at 0%   0%,   #efece1 0%, transparent 55%),
        linear-gradient(180deg, #eeece3 0%, #f8efaa 100%);
      border-radius: 40px;
      padding: 52px 48px;
      box-shadow: 0 40px 80px -40px #00000033, 0 4px 16px -8px #00000010;
      border: 1px solid #ffffff80;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 540px;
    }

    /* logo pill */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--line-soft);
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      align-self: flex-start;
    }
    .logo-mark {
      width: 20px; height: 20px;
      border-radius: 5px;
      background: linear-gradient(135deg, var(--ink) 60%, var(--yellow) 60%);
      position: relative;
      flex-shrink: 0;
    }
    .logo-mark::after {
      content: "";
      position: absolute;
      inset: 5px 4px 4px 5px;
      background: var(--cream);
      border-radius: 2px;
    }

    /* hero headline */
    .brand-hero {
      padding: 24px 0 20px;
    }
    .brand-hero h1 {
      font-size: 68px;
      line-height: 0.93;
      font-weight: 400;
      letter-spacing: -0.04em;
      margin-bottom: 22px;
      color: var(--ink);
    }
    .brand-hero h1 em {
      font-style: normal;
      color: var(--mute);
    }
    .brand-hero p {
      font-size: 16px;
      color: var(--mute);
      line-height: 1.55;
      max-width: 320px;
      font-weight: 400;
    }

    /* feature pills row */
    .feat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }
    .feat-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #ffffff70;
      backdrop-filter: blur(8px);
      border: 1px solid #ffffff90;
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }
    .feat-chip .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--yellow-deep);
      flex-shrink: 0;
    }
    .feat-chip .dot.g { background: #69a444; }
    .feat-chip .dot.d { background: var(--ink); }

    /* ── Right: sign-in card ── */
    .signin-card {
      background: linear-gradient(180deg, #fefcec 0%, #fbf3c8 100%);
      border-radius: 40px;
      padding: 52px 48px;
      box-shadow: 0 40px 80px -40px #00000022, 0 4px 16px -8px #00000010;
      border: 1px solid #ffffff80;
    }

    .signin-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--mute);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .signin-title {
      font-size: 44px;
      font-weight: 400;
      letter-spacing: -0.035em;
      line-height: 1;
      margin-bottom: 36px;
      color: var(--ink);
    }

    /* input field */
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }
    .field label {
      font-size: 13px;
      color: var(--mute);
      font-weight: 500;
    }
    .field input {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px;
      font-size: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--ink);
      outline: none;
      transition: border-color .18s, box-shadow .18s;
      width: 100%;
      letter-spacing: -0.01em;
    }
    .field input::placeholder { color: var(--mute-2); }
    .field input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px #15140f14;
    }

    /* sign in button — pill dark */
    .btn-signin {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 18px 24px 18px 28px;
      font-size: 17px;
      font-weight: 500;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.01em;
      cursor: pointer;
      margin-top: 28px;
      transition: background .15s, transform .15s, box-shadow .15s;
    }
    .btn-signin:hover {
      background: var(--ink-2);
      transform: translateY(-1px);
      box-shadow: 0 12px 32px -8px #00000040;
    }
    .btn-signin:active { transform: none; box-shadow: none; }
    .btn-signin .arr {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--yellow);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    /* error / hint */
    .login-error {
      background: #fff0f0;
      border: 1px solid #ffd0d0;
      color: #c00;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .login-hint {
      margin-top: 14px;
      font-size: 12px;
      color: var(--mute);
      background: #ffffff60;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      display: none;
    }

    /* divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0;
      color: var(--mute-2); font-size: 13px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--line);
    }

    /* workspace pill at bottom of card */
    .ws-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff60;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 13px;
      color: var(--mute);
      margin-top: 24px;
      width: 100%;
      justify-content: center;
    }
    .ws-pill svg { opacity: .5; }

    /* responsive */
    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; max-width: 440px; }
      .brand-card { min-height: auto; padding: 36px 32px; }
      .brand-hero h1 { font-size: 48px; }
      .signin-card { padding: 36px 32px; }
      .signin-title { font-size: 34px; }
    }
  </style>
</head>
<body>

<div class="page">

  <!-- ── Left brand panel ── -->
  <div class="brand-card">
    <div class="logo">
      <div class="logo-mark"></div>
      Olla Nest
    </div>

    <div class="brand-hero">
      <h1>Your team's<br>local <em>AI,</em><br>one place.</h1>
      <p>Private AI models for every employee. No data leaves your network. Managed entirely by your team.</p>

      <div class="feat-row">
        <div class="feat-chip"><span class="dot"></span>Auto Router</div>
        <div class="feat-chip"><span class="dot g"></span>100% Local</div>
        <div class="feat-chip"><span class="dot d"></span>Admin Control</div>
        <div class="feat-chip"><span class="dot"></span>File Output</div>
      </div>
    </div>
  </div>

  <!-- ── Right sign-in panel ── -->
  <div class="signin-card">
    <div class="signin-label">Workspace access</div>
    <div class="signin-title">Welcome<br>back.</div>

    <form id="loginForm" novalidate autocomplete="off">
      <div class="login-error" id="loginError"></div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username"
               placeholder="you@company.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               placeholder="••••••••••••" required />
      </div>

      <button class="btn-signin" type="submit" id="submitBtn">
        <span>Sign in</span>
        <span class="arr">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </span>
      </button>
    </form>

    <div class="login-hint" id="bootstrapHint"></div>

    <div class="divider">Olla Nest · AI Workspace</div>

    <div class="ws-pill">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      Runs entirely on your infrastructure
    </div>
  </div>

</div>

<script src="/login.js"></script>
</body>
</html>
