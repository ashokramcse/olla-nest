# =============================================================================
# Olla Nest — Admin Service Configuration
# Service  : olla-nest-admin (Admin Control Panel) — v2026.1.10
# Port     : 8080
# Runtime  : Oracle Java 26 JVM  |  Spring Boot 3.5.14
# Database : SQLite 3.49.x (WAL mode) — shared with user service
# Flyway   : ENABLED — admin service owns schema migrations
# =============================================================================

spring.application.name=olla-nest-admin

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${ADMIN_PORT:8080}

# ── SQLite datasource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./data}/olla-nest.sqlite?foreign_keys=on&journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON; PRAGMA synchronous=NORMAL; PRAGMA busy_timeout=5000;

# ── Flyway — admin owns migrations ───────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# ── Spring Security ──────────────────────────────────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ── App settings ─────────────────────────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
encryption.key=${ENCRYPTION_KEY:change-me-in-production}
app.data-dir=${DATA_DIR:./data}
app.static-dir=${STATIC_DIR:./public}
app.version=@project.version@
app.cookie-secure=${COOKIE_SECURE:false}
app.trusted-proxy=${TRUSTED_PROXY:}
# Public base URL (used as the allowed WebSocket origin and for absolute links).
# Configurable so the admin app can run on any host/port; defaults to the
# conventional dev port. Set ADMIN_BASE_URL to match when running elsewhere.
app.base-url=${ADMIN_BASE_URL:http://localhost:8080}
# Distinct session cookie name from the user app (8081). Cookies are host-scoped,
# not port-scoped, so a shared name would let admin and user clobber each other's
# sessions in the same browser. Admin keeps the original default.
app.session-cookie-name=${SESSION_COOKIE_NAME:olla_nest_session}
app.default-admin-email=${DEFAULT_ADMIN_EMAIL:admin@ollanest.local}
app.default-admin-password=${DEFAULT_ADMIN_PASSWORD:CHANGE_ME_ON_FIRST_BOOT}
app.default-user-password=${DEFAULT_USER_PASSWORD:CHANGE_ME_ON_FIRST_BOOT}

# ── RAG ──────────────────────────────────────────────────────────────────────
rag.enabled=true
rag.top-k=5
rag.similarity-threshold=0.30

# ── Function calling ─────────────────────────────────────────────────────────
functions.enabled=true

# ── Spring AI ────────────────────────────────────────────────────────────────
spring.ai.enabled=false

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ollanest=INFO
logging.level.org.flywaydb=WARN
logging.level.org.springframework.security=WARN
logging.file.name=${app.data-dir:./data}/logs/olla-nest-admin.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# ── Loki ─────────────────────────────────────────────────────────────────────
# Log shipping to the standalone Loki/Grafana stack. The Loki appender is only
# wired in when the app runs with the "loki" (or "prod") Spring profile — see
# logback-spring.xml. Override the endpoint with LOKI_URL when Loki runs on a
# non-default port/host (must match LOKI_PORT in the monitoring stack).
loki.enabled=${LOKI_ENABLED:true}
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

# ── Misc ─────────────────────────────────────────────────────────────────────
spring.security.filter.order=10
spring.mvc.async.request-timeout=-1
server.servlet.session.timeout=0
