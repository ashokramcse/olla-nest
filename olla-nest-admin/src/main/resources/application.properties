# =============================================================================
# Olla Nest — Admin Service Configuration
# Service  : olla-nest-admin (Admin Control Panel)
# Port     : 8080
# Runtime  : Oracle Java 26 JVM  |  Spring Boot 3.5.14
# Database : SQLite 3.49.x (WAL mode) — shared with user service
# Flyway   : ENABLED — admin service owns schema migrations
# =============================================================================

spring.application.name=olla-nest-admin

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${ADMIN_PORT:8080}

# ── SQLite datasource ────────────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./data}/olla-nest.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA foreign_keys=ON; PRAGMA synchronous=NORMAL; PRAGMA busy_timeout=5000;

# ── Flyway — admin owns migrations ───────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ── Spring Security ──────────────────────────────────────────────────────────
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── App settings ─────────────────────────────────────────────────────────────
ollama.url=${OLLAMA_URL:http://localhost:11434}
encryption.key=${ENCRYPTION_KEY:change-me-in-production}
app.data-dir=${DATA_DIR:./data}
app.static-dir=${STATIC_DIR:./public}
app.version=v2026.1.5
app.cookie-secure=${COOKIE_SECURE:false}
app.trusted-proxy=${TRUSTED_PROXY:}
app.default-admin-email=${DEFAULT_ADMIN_EMAIL:admin@ollanest.local}
app.default-admin-password=${DEFAULT_ADMIN_PASSWORD:CHANGE_ME_ON_FIRST_BOOT}
app.default-user-password=${DEFAULT_USER_PASSWORD:CHANGE_ME_ON_FIRST_BOOT}

# ── RAG ──────────────────────────────────────────────────────────────────────
rag.enabled=true
rag.top-k=5
rag.similarity-threshold=0.30

# ── Function calling ─────────────────────────────────────────────────────────
functions.enabled=true

# ── Spring AI ────────────────────────────────────────────────────────────────
spring.ai.enabled=false

# ── File upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.ollanest=INFO
logging.level.org.flywaydb=WARN
logging.level.org.springframework.security=WARN
logging.file.name=${app.data-dir:./data}/logs/olla-nest-admin.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB

# ── Loki ─────────────────────────────────────────────────────────────────────
loki.enabled=true
loki.url=http://localhost:3100/loki/api/v1/push

# ── Misc ─────────────────────────────────────────────────────────────────────
spring.security.filter.order=10
spring.mvc.async.request-timeout=-1
server.servlet.session.timeout=0
