# Grafana Loki — Configuration for Olla Nest
# Single-process mode (no Kubernetes / microservices needed)
# LOKI_DATA_DIR is set by start_monitoring.sh before launching Loki.

auth_enabled: false

server:
  # LOKI_PORT is exported by start_monitoring.sh (default 3100); expanded via
  # Loki's -config.expand-env=true flag.
  http_listen_port: ${LOKI_PORT}
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA_DIR}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA_DIR}/chunks
      rules_directory:  ${LOKI_DATA_DIR}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Retention: keep 30 days of logs
limits_config:
  retention_period: 720h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_query_series: 5000
  max_query_lookback: 720h

compactor:
  working_directory: ${LOKI_DATA_DIR}/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
