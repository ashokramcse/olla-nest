apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    # LOKI_PORT is exported by start_monitoring.sh (default 3100). Grafana
    # interpolates ${VAR} in provisioning files from its process environment.
    url: http://localhost:${LOKI_PORT}
    isDefault: true
    version: 1
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
